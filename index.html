<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Verification Success</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #0b0c0e;
        }

        /* Checkmark Drawing Animation */
        .checkmark-circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 3;
            stroke-miterlimit: 10;
            stroke: #10b981;
            fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }

        .checkmark-check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.6s forwards;
        }

        @keyframes stroke {
            100% {
                stroke-dashoffset: 0;
            }
        }

        /* Subtle Pulse & Glow Effect for the Checkmark Container */
        .check-glow {
            animation: subtleGlow 3s infinite alternate ease-in-out;
        }

        @keyframes subtleGlow {
            0% {
                box-shadow: 0 0 15px rgba(16, 185, 129, 0.15), inset 0 0 10px rgba(16, 185, 129, 0.1);
                transform: scale(1);
            }
            100% {
                box-shadow: 0 0 30px rgba(16, 185, 129, 0.35), inset 0 0 15px rgba(16, 185, 129, 0.2);
                transform: scale(1.03);
            }
        }

        /* Floating particles background effect */
        .bg-glow-point {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-gray-200 antialiased relative overflow-x-hidden">

    <!-- Background Radial Glow -->
    <div class="bg-glow-point"></div>

    <!-- Main Card Container -->
    <div class="relative z-10 w-full max-w-md bg-[#13151b] border border-gray-800/60 rounded-3xl p-8 sm:p-10 shadow-2xl backdrop-blur-sm text-center flex flex-col items-center">
        
        <!-- Top Glow Gradient Accent -->
        <div class="absolute top-0 right-0 w-32 h-32 bg-emerald-500/5 rounded-full blur-2xl pointer-events-none"></div>

        <!-- Discord App Logo Icon -->
        <div class="w-16 h-16 bg-[#5865F2] rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-500/20 mb-4 transition-transform hover:scale-105 duration-300">
            <svg class="w-10 h-10 text-white fill-current" viewBox="0 0 127.14 96.36">
                <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0, -3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1, -10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22c2.86-28.51-4.7-52.23-18.9-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74C48.91,40.26,54,46,53.89,53,53.89,60,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74C91.13,40.26,96.22,46,96.12,53,96.12,60,91.06,65.69,84.69,65.69Z"/>
            </svg>
        </div>

        <!-- Verification Header -->
        <h1 class="text-2xl font-bold text-white tracking-wide">Verify</h1>
        <p class="text-gray-400 text-sm mt-1 font-light">Premium Verification</p>

        <!-- Status Pill Badge -->
        <div class="mt-4 inline-flex items-center gap-2 px-3 py-1 bg-emerald-950/60 border border-emerald-800/40 text-emerald-400 rounded-full text-xs font-medium">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            ยืนยันตัวตนสำเร็จ
        </div>

        <!-- Animated Checkmark Circle Container -->
        <div class="my-8 relative flex items-center justify-center">
            <div class="w-24 h-24 rounded-full bg-[#161f1c] border border-emerald-900/40 flex items-center justify-center check-glow transition-all">
                <svg class="w-12 h-12 stroke-emerald-400" viewBox="0 0 52 52">
                    <circle class="checkmark-circle" cx="26" cy="26" r="23" fill="none"/>
                    <path class="checkmark-check" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                </svg>
            </div>
        </div>

        <!-- Success Message -->
        <h2 class="text-xl sm:text-2xl font-bold text-white mb-2">
            ยืนยันตัวตนเรียบร้อยแล้ว
        </h2>
        <p class="text-gray-400 text-xs sm:text-sm max-w-xs leading-relaxed mb-6 font-light">
            ระบบได้ยืนยันตัวตนของคุณเรียบร้อย<br>และเพิ่มเข้าสู่เซิร์ฟเวอร์สำเร็จ
        </p>

        <!-- Server Info Card (Updated to Server Icon + Server Name) -->
        <div class="w-full bg-[#1a1d24] border border-gray-800/80 rounded-2xl p-3.5 mb-6 flex items-center gap-3 text-left">
            <div class="w-12 h-12 rounded-xl overflow-hidden bg-[#5865F2] flex items-center justify-center flex-shrink-0 shadow-inner">
                <!-- Server Icon / Banner Image with Fallback -->
                <img src="https://placehold.co/100x100/5865F2/FFFFFF?text=SRV" alt="Server Icon" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x100/5865F2/FFFFFF?text=SRV'">
            </div>
            <div class="overflow-hidden">
                <div class="text-white text-sm font-semibold truncate">Kuy System Community</div>
                <div class="text-xs text-gray-400 flex items-center gap-1 mt-0.5">
                    <svg class="w-3.5 h-3.5 text-emerald-400 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
                    </svg>
                    <span>Server Verified</span>
                </div>
            </div>
        </div>

        <!-- Action Button -->
        <button onclick="window.close()" class="w-full py-3.5 px-6 bg-[#22c55e] hover:bg-[#1ea750] text-gray-950 font-bold rounded-2xl transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0 shadow-lg shadow-emerald-500/20 flex items-center justify-center">
            กลับสู่ Discord
        </button>

        <!-- Footer Info -->
        <div class="mt-8 text-[11px] text-gray-500 font-light leading-relaxed">
            <p>© 2026 Kuy System</p>
            <p class="text-gray-600">Powered by EARN ARAWARD</p>
        </div>

    </div>

</body>
</html>
